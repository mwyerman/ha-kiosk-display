services:
  display:
    build:
      context: .
      target: production
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      MEALIE_URL: ${MEALIE_URL:-https://mealie.helios.mxwy.org}
      MEALIE_API_KEY: ${MEALIE_API_KEY:-}
      KIOSK_REQUIRE_PAIRING: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      KIOSK_ACCESS_KEY: ${KIOSK_ACCESS_KEY:-}
      KIOSK_VOICE_KEY: ${KIOSK_VOICE_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - cooking-data:/data
  dev:
    profiles: [dev]
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public

volumes:
  cooking-data:
