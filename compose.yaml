services:
  display:
    build:
      context: .
      target: production
    ports:
      - "8080:8080"
    restart: unless-stopped
  dev:
    profiles: [dev]
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
