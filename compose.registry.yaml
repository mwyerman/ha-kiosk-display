# Standalone deployment: no source checkout or local image build required.
services:
  display:
    image: ghcr.io/mwyerman/ha-kiosk-display:${IMAGE_TAG:-latest}
    ports:
      - "${DISPLAY_PORT:-8080}:8080"
    restart: unless-stopped
    environment:
      MEALIE_URL: ${MEALIE_URL:-https://mealie.helios.mxwy.org}
      MEALIE_API_KEY: ${MEALIE_API_KEY:-}
      KIOSK_REQUIRE_PAIRING: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      KIOSK_ACCESS_KEY: ${KIOSK_ACCESS_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - cooking-data:/data

volumes:
  cooking-data:
